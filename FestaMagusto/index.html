<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Total Section -->
        <div class="total-section">
            <div class="total-label">Total</div>
            <div class="total-amount">€<span id="total">0.00</span></div>
            <div class="buttons-container">
                <button class="ticket-btn"><span id="tickets350">0x</span> 3.50€</button>
                <button class="ticket-btn"><span id="tickets250">0x</span> 2.50€</button>
                <button class="clear-btn" onclick="clearCart()"><i class="fa-solid fa-trash"></i></button>
                <button class="save-btn" onclick="saveCart()"><i class="fa-solid fa-floppy-disk"></i></button>
            </div>
        </div>

        <!-- Horizontal Scroll Container -->
        <div class="horizontal-container">
            <!-- Products Section -->
            <div class="products-section">
                <div class="section-title">Products</div>
                <div class="products-grid" id="products-grid"></div>
            </div>

            <!-- Cart Section -->
            <div class="cart-section">
                <div class="cart-title">
                    Cart
                    <span class="cart-count" id="cart-count">0</span>
                </div>
                <div class="cart-items" id="cart-items">
                    <div class="empty-cart">No items added yet</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
            authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
            projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
            storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
            messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
            appId: import.meta.env.VITE_FIREBASE_APP_ID,
            measurementId: import.meta.env.VITE_FIREBASE_MEASUREMENT_ID
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Make db available globally
        window.firebaseDB = db;
        window.firebaseModules = { collection, addDoc, serverTimestamp, doc, setDoc, getDoc, updateDoc, increment };
    </script>
    <script src="script.js"></script>
</body>
</html>
