<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Total Section -->
        <div class="total-section">
            <div class="total-label">Total</div>
            <div class="total-amount">€<span id="total">0.00</span></div>
            <div class="buttons-container">
                <button class="ticket-btn"><span id="tickets350">0x</span> 3.50€</button>
                <button class="ticket-btn"><span id="tickets250">0x</span> 2.50€</button>
                <button class="clear-btn" onclick="clearCart()"><i class="fa-solid fa-trash"></i></button>
                <button class="save-btn" onclick="saveCart()"><i class="fa-solid fa-floppy-disk"></i></button>
            </div>
        </div>

        <!-- Horizontal Scroll Container -->
        <div class="horizontal-container">
            <!-- Products Section -->
            <div class="products-section">
                <div class="section-title">Products</div>
                <div class="products-grid" id="products-grid"></div>
            </div>

            <!-- Cart Section -->
            <div class="cart-section">
                <div class="cart-title">
                    Cart
                    <span class="cart-count" id="cart-count">0</span>
                </div>
                <div class="cart-items" id="cart-items">
                    <div class="empty-cart">No items added yet</div>
                </div>
            </div>

            <!-- Analytics Section -->
            <div class="analytics-section">
                <div class="analytics-header">
                    <div class="section-title">Sales Analytics</div>
                    <div class="date-filters">
                        <div class="date-input-group">
                            <label for="start-date">From:</label>
                            <div class="align-date-and-time">
                                <input type="date" id="start-date" />
                                <input type="time" id="start-time" value="00:00" />
                            </div>
                        </div>
                        <div class="date-input-group">
                            <label for="end-date">To:</label>
                            <div class="align-date-and-time">
                                <input type="date" id="end-date" />
                                <input type="time" id="end-time" value="23:59" />
                            </div>
                        </div>
                        <div class="data-button-group">
                            <button class="load-analytics-btn" onclick="loadAnalytics()">
                                <i class="fa-solid fa-chart-line"></i> Load
                            </button>
                            <button class="clear-analytics-btn" onclick="clearAnalytics()">
                                <i class="fa-solid fa-eraser"></i> Clear
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="analytics-summary" id="analytics-summary">
                    <div class="summary-card total-revenue-card">
                        <div class="summary-label">Receita Total</div>
                        <div class="summary-value" id="total-revenue">€0.00</div>
                    </div>
                    <div class="summary-card total-cash-revenue-card">
                        <div class="summary-label">Receita em Dinheiro</div>
                        <div class="summary-value" id="total-cash-revenue">€0.00</div>
                    </div>
                    <div class="summary-card total-bank-revenue-card">
                        <div class="summary-label">Receita em Cartão</div>
                        <div class="summary-value" id="total-bank-revenue">€0.00</div>
                    </div>
                    <div class="summary-card total-items-sold-card">
                        <div class="summary-label">Total de Itens Vendidos</div>
                        <div class="summary-value" id="total-items-sold">0</div>
                    </div>
                </div>

                <div class="analytics-products" id="analytics-products">
                    <div class="empty-analytics">Select a date range and click Load to view sales data</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, doc, setDoc, getDoc, updateDoc, increment, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyCqKXQJKXObwyXpVS3bITdXiIumhGlMg6w",
            authDomain: "festamae-36e11.firebaseapp.com",
            projectId: "festamae-36e11",
            storageBucket: "festamae-36e11.firebasestorage.app",
            messagingSenderId: "112782501393",
            appId: "1:112782501393:web:c612e27e4ac466c61333b0",
            measurementId: "G-DLPJYRZN0Q"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Make db available globally
        window.firebaseDB = db;
        window.firebaseModules = { collection, addDoc, serverTimestamp, doc, setDoc, getDoc, updateDoc, increment, query, where, getDocs };
    
    </script>
    <script src="script.js"></script>
</body>
</html>
